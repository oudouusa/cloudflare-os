services:
  mock-opencode:
    image: node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
    command:
      - node
      - /qa/mock-opencode.mjs
    volumes:
      - ./qa:/qa:ro
    ports:
      - 127.0.0.1:${MOCK_OPENCODE_HOST_PORT:-14100}:4100
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  litellm:
    ports: !override
      - 127.0.0.1:${MOCK_LITELLM_HOST_PORT:-14002}:4000
    environment:
      CFOS_DEEPSEEK_COMPAT_TRACE: "1"
      OPENCODE_GO_API_BASE: http://mock-opencode:4100/v1
      OPENCODE_GO_API_KEY: mock-opencode-key
    depends_on:
      mock-opencode:
        condition: service_healthy

  cloudflare-os:
    environment:
      PUBLIC_BASE_URL: http://127.0.0.1:${MOCK_CFOS_HOST_PORT:-18878}
    ports: !override
      - 127.0.0.1:${MOCK_CFOS_HOST_PORT:-18878}:8877

volumes:
  cloudflare_os_wrangler:
    name: cloudflare-os-inapp-mock-wrangler
  cloudflare_os_pnpm_store:
    name: cloudflare-os-inapp-mock-pnpm-store
